<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Foodcart Stores – Interactive Mockup</title>
        <link rel="stylesheet" href="assets/mockup.css?v=2">
        <script src="assets/mockup-4.js?v=2"></script>    
    </head>

    <div id="header-placeholder" class=" sticky-top"></div>

        <main class="main" >

            <!-- ============================================ -->
            <!-- PAGE: CHECKOUT -->
            <!-- ============================================ -->
            <div class="page-content">
                
                <div class="page-content-inner container">
                    
                    <h2 class="page-title">Checkout</h2>
                    
                    <form id="checkout-form" class="checkout-grid">
                                            
                        <div class="checkout-form">
                            
                            <h3 style="margin-bottom:16px;">Billing Details</h3>

                            <!-- Full Name -->
                            <div style="margin-bottom:12px;">
                                <label style="display:block; font-weight:600; font-size:0.9rem; margin-bottom:4px;">Full Name <span style="color:#dc2626;">*</span></label>
                                <input type="text" id="checkout-name" placeholder="John Doe" value="" style="width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:8px;">
                            </div>

                            <!-- Phone -->
                            <div style="margin-bottom:12px;">
                                <label style="display:block; font-weight:600; font-size:0.9rem; margin-bottom:4px;">Phone<span style="color:#dc2626;">*</span></label>
                                <input type="tel" id="checkout-phone" placeholder="08012345678" value="" style="width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:8px;">
                            </div>

                            <!-- Email -->
                            <div style="margin-bottom:12px;">
                                <label style="display:block; font-weight:600; font-size:0.9rem; margin-bottom:4px;">Email<span style="color:#dc2626;">*</span></label>
                                <input type="email" id="checkout-email" placeholder="john@example.com" value="" style="width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:8px;">
                            </div>

                            <!-- Address -->
                            <div style="margin-bottom:12px;">
                                <label style="display:block; font-weight:600; font-size:0.9rem; margin-bottom:4px;">Address<span style="color:#dc2626;">*</span></label>
                                <input type="text" id="checkout-address" placeholder="123 Awolowo Road, Opposite Shoprite" value="" style="width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:8px;">
                            </div>

                            <!-- Closest Landmark -->
                            <div style="margin-bottom:12px;">
                                <label style="display:block; font-weight:600; font-size:0.9rem; margin-bottom:4px;">Landmark / Nearest Junction<span style="color:#dc2626;">*</span></label>
                                <input type="text" id="checkout-landmark" placeholder="e.g. Beside Lotus Bank" value="" style="width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:8px;">
                            </div>

                            <!-- LGA -->
                            <div style="margin-bottom:12px;">
                                <label style="display:block; font-weight:600; font-size:0.9rem; margin-bottom:4px;">Local Government Area (LGA) <span style="color:#dc2626;">*</span></label>
                                <select id="checkout-lga" style="width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:8px; background:white;">
                                    <option value="">Select LGA...</option>
                                    <option value="agege">Agege</option>
                                    <option value="ajeromi-ifelodun">Ajeromi/Ifelodun</option>
                                    <option value="alimosho">Alimosho</option>
                                    <option value="Apapa">Apapa</option>
                                    <option value="amuwo-odofin">Amuwo Odofin</option>
                                    <option value="badagry">Badagry</option>
                                    <option value="eti-osa">Eti-Osa (Lekki/VI)</option>
                                    <option value="epe">Epe</option>
                                    <option value="ibeju-lekki">Ibeju-Lekki</option>
                                    <option value="ifako-ijaye">Ifako-Ijaye</option>
                                    <option value="ikeja" selected>Ikeja</option>
                                    <option value="ikorodu">Ikorodu</option>
                                    <option value="kosofe">Kosofe</option>
                                    <option value="lagos-island">Lagos Island</option>
                                    <option value="lagos-mainland">Lagos Mainland</option>
                                    <option value="mushin">Mushin</option>
                                    <option value="oshodi-isolo">Oshodi-Isolo</option>
                                    <option value="ojo">Ojo</option>
                                    <option value="somolu">Somolu</option>
                                     <option value="surulere">Surulere</option>
                               </select>
                            </div>

                            <!-- Delivery Speed -->
                            <div>
                                <label style="display:block; font-weight:600; font-size:0.9rem; margin-bottom:4px;">Delivery Speed</label>
                                <select id="checkout-speed" style="width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:8px; background:white;">
                                    <option value="express" data-fee="700">🚀 Express (Same-Day) – ₦700</option>
                                    <option value="standard" data-fee="300">📦 Standard (3-5 days) – ₦300</option>
                                </select>                                                               
                            </div>

                            <!-- Payment Method (optional, for demo) -->
                            <div style="margin-bottom:16px;">
                                <label style="display:block; font-weight:600; font-size:0.9rem; margin-bottom:4px;">Payment Method</label>
                                <select id="checkout-payment" style="width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:8px; background:white;">
                                    <option value="card">💳 Card</option>
                                    <option value="bank">🏦 Bank Transfer</option>
                                    <option value="ussd">📱USSD Transfer</option>
                                    <option value="cod">💵 Cash on Delivery</option>
                                </select>
                            </div>
                            
                        </div>

                        <div id="order-summary" class="order-summary">

                            <h3>Your Order</h3>

                            <div class="order-summary-inner" style="margin-bottom: 25px;">
                              
                            </div>
                            
                            <!-- Place Order Button -->
                            <button id="order-btn" type="submit" class="btn btn-green" style="width:100%; padding:14px; border-radius:8px; font-size:1.1rem; font-weight:700; border:none; cursor:pointer; background:#16a34a; color:white;">🛒 Place Order</button>

                            <!--<button class="btn btn-green" style="width:100%; padding:14px; border-radius:8px; font-size:1.1rem; margin-top:12px;">✔ Place Order</button>-->

                            <p class="">🔒 Secure transaction via Paystack</p>

                        </div>
                    
                    </form>

                </div>

            </div>

        </main>

    <div id="footer-placeholder"></div>
    
    <!-- A single, reusable script -->
    <script src="loader.js"></script>
    
</html>
