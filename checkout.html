<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Foodcart Stores – Interactive Mockup</title>
        <link rel="stylesheet" href="assets/mockup.css?v=2">
        <script src="assets/mockup-4.js?v=2"></script>    
    </head>

    <div id="header-placeholder" class=" sticky-top"></div>

        <main class="main" >

            <!-- ============================================ -->
            <!-- PAGE: CHECKOUT -->
            <!-- ============================================ -->
            <div class="page-content">
                
                <div class="page-content-inner container">
                    
                    <h2 class="page-title">Checkout</h2>
                    
                    <form id="checkout-form" class="checkout-grid">
                                            
                        <div class="checkout-grid-inner">
                            
                            <!-- Billing Details -->
                            <div id="billing" class="billing-column">
                                
                                <h3 class="form-title">Billing Details</h3>

                                <div class="column-inner">

                                    <!-- Full Name -->
                                    <div class="input-wrap">
                                        <span class="input-label">Full Name <span class="required">*</span></span>
                                        <input type="text" id="billing-name" class="input-field" placeholder="John Doe" value="" required>
                                    </div>

                                    <!-- Phone -->
                                    <div class="input-wrap">
                                        <span class="input-label">Phone <span class="required">*</span></span>
                                        <input type="tel" id="billing-phone" class="input-field" placeholder="08012345678" value="" required>
                                    </div>

                                    <!-- Email -->
                                    <div class="input-wrap">
                                        <span class="input-label">E-mail <span class="required">*</span></span>
                                        <input type="email" id="billing-email" class="input-field" placeholder="john@example.com" value="" required>
                                    </div>

                                    <!-- Address -->
                                    <div class="input-wrap">
                                        <span class="input-label">Address <span class="required">*</span></span>
                                        <input id="billing-address-1" class="input-field" name="billing-address-1" placeholder="Line 1: House No. and Street Name" value="" required></input>
                                        <input id="billing-address-2" class="input-field" name="billing-address-2" placeholder="Line 2: Apartment, Block, Suite No. or Closest Landmark (Optional)" value=""></input>
                                    </div>

                                    <!-- Suburb/Town -->
                                    <div class="input-wrap">
                                        <label class="input-label">Suburb/Town<span class="required">*</span></label>
                                        <input type="text" id="billing-suburb" class="input-field" placeholder="e.g. Ilasamaja, Ipodo" value="" required>
                                    </div>

                                    <!-- LGA -->
                                    <div class="input-wrap">
                                        <span class="input-label">LGA <span class="required">*</span></span>
                                        <select id="billing-lga" class="input-selector" title="checkout" required>
                                            <option value="">Select LGA...</option>
                                            <option value="agege">Agege</option>
                                            <option value="ajeromi-ifelodun">Ajeromi/Ifelodun</option>
                                            <option value="alimosho">Alimosho</option>
                                            <option value="Apapa">Apapa</option>
                                            <option value="amuwo-odofin">Amuwo Odofin</option>
                                            <option value="badagry">Badagry</option>
                                            <option value="eti-osa">Eti-Osa (Lekki/VI)</option>
                                            <option value="epe">Epe</option>
                                            <option value="ibeju-lekki">Ibeju-Lekki</option>
                                            <option value="ifako-ijaye">Ifako-Ijaye</option>
                                            <option value="ikeja" selected>Ikeja</option>
                                            <option value="ikorodu">Ikorodu</option>
                                            <option value="kosofe">Kosofe</option>
                                            <option value="lagos-island">Lagos Island</option>
                                            <option value="lagos-mainland">Lagos Mainland</option>
                                            <option value="mushin">Mushin</option>
                                            <option value="oshodi-isolo">Oshodi-Isolo</option>
                                            <option value="ojo">Ojo</option>
                                            <option value="somolu">Somolu</option>
                                            <option value="surulere">Surulere</option>
                                        </select>
                                    </div>

                                </div>

                                <!-- Collect Shipping Data -->
                                <div class="check-wrap">
                                    <input id="ship-to-different" class="auth-check" type="checkbox">
                                    <label class="auth-label" for="ship-to-different">Ship to a different Address?</label>
                                </div>

                            </div>

                            <!-- Shipping Details -->
                            <div id="shipping" class="shipping-column d-none">
                                
                                <h3 class="form-title">Shipping Details</h3>

                                <div class="column-inner">
                                    
                                    <!-- Full Name -->
                                    <div class="input-wrap">
                                        <span class="input-label">Full Name <span class="required">*</span></span>
                                        <input type="text" id="shipping-name" class="input-field" placeholder="John Doe" value="">
                                    </div>

                                    <!-- Phone -->
                                    <div class="input-wrap">
                                        <span class="input-label">Phone <span class="required">*</span></span>
                                        <input type="tel" id="shipping-phone" class="input-field" placeholder="08012345678" value="">
                                    </div>

                                    <!-- Email -->
                                    <div class="input-wrap">
                                        <span class="input-label">E-mail <span class="required">*</span></span>
                                        <input type="email" id="shipping-email" class="input-field" placeholder="john@example.com" value="">
                                    </div>

                                    <!-- Address -->
                                    <div class="input-wrap">
                                        <span class="input-label">Address <span class="required">*</span></span>
                                        <input id="shipping-address-1" class="input-field" name="shipping-address-1" placeholder="Line 1: House No. and Street Name" value="" required></input>
                                        <input id="shipping-address-2" class="input-field" name="shipping-address-2" placeholder="Line 2: Apartment, Block, Suite No. or Closest Landmark (Optional)" value=""></input>
                                    </div>

                                    <!-- Suburb/Town -->
                                    <div class="input-wrap">
                                        <label class="input-label">Suburb/Town<span class="required">*</span></label>
                                        <input type="text" id="shipping-suburb" class="input-field" placeholder="e.g. Ilasamaja, Ipodo" value="">
                                    </div>

                                    <!-- LGA -->
                                    <div class="input-wrap">
                                        <span class="input-label">LGA <span class="required">*</span></span>
                                        <select id="shipping-lga" class="input-selector" title="checkout" required>
                                            <option value="">Select LGA...</option>
                                            <option value="agege">Agege</option>
                                            <option value="ajeromi-ifelodun">Ajeromi/Ifelodun</option>
                                            <option value="alimosho">Alimosho</option>
                                            <option value="Apapa">Apapa</option>
                                            <option value="amuwo-odofin">Amuwo Odofin</option>
                                            <option value="badagry">Badagry</option>
                                            <option value="eti-osa">Eti-Osa (Lekki/VI)</option>
                                            <option value="epe">Epe</option>
                                            <option value="ibeju-lekki">Ibeju-Lekki</option>
                                            <option value="ifako-ijaye">Ifako-Ijaye</option>
                                            <option value="ikeja" selected>Ikeja</option>
                                            <option value="ikorodu">Ikorodu</option>
                                            <option value="kosofe">Kosofe</option>
                                            <option value="lagos-island">Lagos Island</option>
                                            <option value="lagos-mainland">Lagos Mainland</option>
                                            <option value="mushin">Mushin</option>
                                            <option value="oshodi-isolo">Oshodi-Isolo</option>
                                            <option value="ojo">Ojo</option>
                                            <option value="somolu">Somolu</option>
                                            <option value="surulere">Surulere</option>
                                        </select>
                                    </div>
                                    
                                </div>

                            </div>

                            <!-- Delivery Speed -->
                            <div class="input-wrap">
                                <span class="input-label">Delivery Speed <span class="required">*</span></span>
                                <select id="checkout-speed" class="input-selector" title="checkout" required>
                                    <option value="express" data-fee="700">🚀 Express (Same-Day) – ₦700</option>
                                    <option value="standard" data-fee="300">📦 Standard (3-5 days) – ₦300</option>
                                </select>                                                               
                            </div>

                            <!-- Payment Method (optional, for demo) -->
                            <div class="input-wrap">
                                <span class="input-label">Payment Method<span class="required">*</span></span>
                                <select id="checkout-payment" class="input-selector" title="checkout" required>
                                    <option value="card">💳 Card</option>
                                    <option value="bank">🏦 Bank Transfer</option>
                                    <option value="ussd">📱USSD Transfer</option>
                                    <option value="cod">💵 Cash on Delivery</option>
                                </select>
                            </div>
                            
                        </div>

                        <div id="order-summary" class="order-summary">

                            <h3 class="summary-title">Order Summary</h3>

                            <div class="order-summary-inner">
                              
                            </div>
                            
                            <!-- Place Order Button -->
                            <div class="push-order">

                                <button id="order-btn" type="submit" class="btn btn-green checkout-order">Place Order ✔</button>

                                <p class="footnote">🔒 Secure transaction via Paystack</p>

                            </div>

                        </div>
                    
                    </form>

                </div>

            </div>

        </main>

    <div id="footer-placeholder"></div>
    
    <!-- A single, reusable script -->
    <script src="loader.js"></script>
    
</html>
