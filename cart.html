<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Foodcart Stores – Interactive Mockup</title>
        <link rel="stylesheet" href="assets/mockup.css?v=2">
        <script src="assets/mockup-4.js?v=2"></script>    
    </head>

    <div id="header-placeholder" class=" sticky-top"></div>

        <main class="main" >

            <!-- ============================================ -->
            <!-- PAGE: CART -->
            <!-- ============================================ -->
            <div class="page-content">

                <div class="page-content-inner container">

                    <h2 class="page-title">Basket</h2>

                    <div id="cart-grid-container" class="cart-grid">

                        <!-- CART ITEMS COLUMN -->
                        <div id="cart-items" class="cart-items">

                            <table class="cart-table">
                                <thead>
                                    <tr>
                                        <th>Product</th>
                                        <th>Price</th>
                                        <th>Qty</th>
                                        <th>Subtotal</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody id="cart-table-body">
                                    <!-- Dynamically populated via JavaScript -->
                                </tbody>
                            </table>

                            <!-- Dynamic Free Delivery Progress Bar -->
                            <div id="free-shipping-container" style="background:#f8fafc; padding:16px; border-radius:8px; margin:12px 0; border:1px solid #e2e8f0;">
                                <!-- Dynamically populated via JavaScript -->
                            </div>      

                        </div>

                        <!-- CART SUMMARY COLUMN -->
                        <div class="cart-total">
                            <div style="display:flex; justify-content:space-between; max-width:400px; margin-left:auto;">
                                <span>Subtotal:</span>
                                <span id="cart-subtotal-display">₦0</span>
                            </div>
                            
                            <div style="display:flex; justify-content:space-between; max-width:400px; margin-left:auto; color:#64748b;">
                                <span>Delivery (Ikeja LGA):</span>
                                <span id="delivery-fee-display">₦700</span>
                            </div>

                            <div style="display:flex; justify-content:space-between; max-width:400px; margin-left:auto; font-size:1.8rem; font-weight:700; border-top:2px solid #e2e8f0; padding-top:12px; margin-top:8px;">
                                <span>Total:</span>
                                <span id="cart-total-display">₦0</span>
                            </div>

                            <a href="checkout.html" id="checkoutBtn" class="btn btn-green" style="margin-top:16px; padding:12px 40px; display:inline-block; text-align:center;">Proceed to Checkout →</a>
                        </div>

                    </div>

                </div>

            </div>

        </main>

    <div id="footer-placeholder"></div>
    
    <!-- A single, reusable script -->
    <script src="loader.js"></script>

</html>
